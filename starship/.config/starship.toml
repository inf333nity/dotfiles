"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"


add_newline = false

format = """
[╭─  ](overlay1)\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time
[╰─ ](overlay1)$character"""

[directory]
style = "bold lavender"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style)) "

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "subtext0"

[time]
disabled = false
format = "[$time]($style)"
style = "subtext0"
time_format = "%H:%M"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](yellow)"


