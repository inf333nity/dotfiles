"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"


add_newline = false

format = """
[╭─  ](overlay1)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$kubernetes\
$fill\
$status\
$cmd_duration\
$time
[╰─ ](overlay1)$character"""

# ─────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────

[directory]
style = "bold lavender"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"

# ─────────────────────────────────────────────
# Git
# ─────────────────────────────────────────────

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style)) "

# ─────────────────────────────────────────────
# Python
# ─────────────────────────────────────────────

[python]
symbol = " "
style = "yellow"
format = "[$symbol$pyenv_prefix$version( $virtualenv)]($style) "

pyenv_version_name = true
pyenv_prefix = "pyenv "

detect_extensions = ["py"]
detect_files = [
    "requirements.txt",
    "pyproject.toml",
    "Pipfile",
    "tox.ini",
    "setup.py",
]

# ─────────────────────────────────────────────
# Node
# ─────────────────────────────────────────────

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = [
    "package.json",
    ".node-version",
]

# ─────────────────────────────────────────────
# Rust
# ─────────────────────────────────────────────

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# Go
# ─────────────────────────────────────────────

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# Docker
# ─────────────────────────────────────────────

[docker_context]
symbol = " "
style = "sapphire"
format = "[$symbol$context]($style) "

only_with_files = true

# ─────────────────────────────────────────────
# Kubernetes
# ─────────────────────────────────────────────

[kubernetes]
symbol = "󱃾 "
style = "sky"
format = "[$symbol$context( \\($namespace\\))]($style) "

disabled = false

# ─────────────────────────────────────────────
# Command status
# ─────────────────────────────────────────────

[status]
disabled = false
symbol = "✘ "
style = "red"
format = "[$symbol$status]($style) "

# ─────────────────────────────────────────────
# Command duration
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "subtext0"

# ─────────────────────────────────────────────
# Time
# ─────────────────────────────────────────────

[time]
disabled = false
format = "[$time]($style)"
style = "subtext0"
time_format = "%H:%M"

# ─────────────────────────────────────────────
# Fill
# ─────────────────────────────────────────────

[fill]
symbol = " "

# ─────────────────────────────────────────────
# Character
# ─────────────────────────────────────────────

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](yellow)"

# ─────────────────────────────────────────────
# Optional system information
# ─────────────────────────────────────────────

[username]
show_always = false
style_user = "text"
style_root = "red"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "pink"
format = "[@$hostname]($style) "


