save-position-on-quit=yes
watch-later-directory=~/.config/mpv/watch_later
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles
slang=ru,rus,en,eng

vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# Хороший обычный scaler для финального масштабирования
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Не тратить GPU на лишние эффекты
deband=no

